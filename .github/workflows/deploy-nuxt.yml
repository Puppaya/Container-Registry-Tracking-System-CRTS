name: Deploy CRTS (Nuxt) with PM2

on:
  push:
    branches:
      - Deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          bun install
      - name: prisma generate
        run: bunx prisma generate
      - name: Run tests
        run: bun run test

  call-deploy:
    needs: test
    runs-on: ["self-hosted", "WIN-F1K8J4DFM0U"]

    env:
      DEPLOY_DIR: ${{ github.ref_name == 'Deploy' && 'C:\inetpub\wwwroot\CRTS\prd'}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install dependencies
        shell: cmd
        run: |
          del /f package-lock.json 2>nul
          bun install
      - name: prisma generate
        run: bunx prisma generate
      - name: build Nuxt app
        run: bun run build
      - name: Copy build to IIS folder
        shell: powershell
        run: |
          $dest = "${{ env.DEPLOY_DIR }}"
          $longDest = "\\?\$dest"

          # Use .NET to delete destination (supports long paths > 260 chars)
          if (Test-Path $dest) {
            try {
              [System.IO.Directory]::Delete($longDest, $true)
            } catch {
              Write-Warning "Delete failed: $_"
              exit 1
            }
          }

          # Copy new build output
          $src = "$env:GITHUB_WORKSPACE\.output"
          robocopy $src $dest /E /IS /IT /NFL /NDL /NJH /NJS /256 /SL
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit 1 }

  pm2_restart:
    needs: call-deploy
    runs-on: ["self-hosted", "WIN-F1K8J4DFM0U"]

    steps:
      - name: Restart PM2 (Production)
        if: github.ref_name == 'Deploy'
        shell: cmd
        run: |
          cd C:\inetpub\wwwroot\CRTS
          pm2 startOrRestart ecosystem.config.cjs --env production
          pm2 save