name: Deploy CRTS (Nuxt) with PM2

on:
  push:
    branches:
      - Deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          bun install
      - name: prisma generate
        run: bunx prisma generate
      - name: Run tests
        run: bun run test

  call-deploy:
    needs: test
    runs-on: ["self-hosted", "WIN-F1K8J4DFM0U"]

    env:
      DEPLOY_DIR: ${{ github.ref_name == 'Deploy' && 'C:\inetpub\wwwroot\CRTS\prd'}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install dependencies
        shell: cmd
        run: |
          del /f package-lock.json 2>nul
          bun install
      - name: prisma generate
        run: bunx prisma generate
      - name: build Nuxt app
        run: bun run build
      - name: Copy build to IIS folder
        shell: cmd
        run: |
          mkdir C:\empty_temp
          robocopy C:\empty_temp "${{ env.DEPLOY_DIR }}" /PURGE /MIR /256 /SL
          rmdir /s /q C:\empty_temp
          rmdir /s /q "${{ env.DEPLOY_DIR }}"
          robocopy "%GITHUB_WORKSPACE%\.output" "${{ env.DEPLOY_DIR }}" /E /IS /IT /NFL /NDL /NJH /NJS /256 /SL
          if %errorlevel% leq 7 exit /b 0
          exit /b 1

  pm2_restart:
    needs: call-deploy
    runs-on: ["self-hosted", "WIN-F1K8J4DFM0U"]

    steps:
      - name: Restart PM2 (Production)
        if: github.ref_name == 'Deploy'
        shell: cmd
        run: |
          cd C:\inetpub\wwwroot\CRTS
          pm2 startOrRestart ecosystem.config.cjs --env production
          pm2 save