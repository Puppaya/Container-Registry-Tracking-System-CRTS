name: Deploy CRTS (Nuxt) with PM2

on:
  push:
    branches:
      - Deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          bun install
      - name: prisma generate
        run: bunx prisma generate
      - name: Run tests
        run: bun run test

  call-deploy:
    needs: test
    runs-on: ["self-hosted", "WIN-F1K8J4DFM0U"]

    env:
      DEPLOY_DIR: ${{ github.ref_name == 'Deploy' && 'C:\inetpub\wwwroot\CRTS\prd'}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install dependencies
        shell: cmd
        run: |
          del /f package-lock.json 2>nul
          bun install
      - name: prisma generate
        run: bunx prisma generate
      - name: Load SECRET_KEY from ecosystem.config.cjs
        shell: powershell
        run: |
          $ecoPath = 'C:\inetpub\wwwroot\CRTS\ecosystem.config.cjs'
          if (-not (Test-Path $ecoPath)) {
            throw "ecosystem.config.cjs not found at $ecoPath"
          }
          $secret = & bun -e "const cfg=require(process.argv[1]); const env=cfg?.apps?.[0]?.env_production; if(!env?.SECRET_KEY){process.exit(1)}; process.stdout.write(env.SECRET_KEY)" $ecoPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($secret)) {
            throw "Failed to read SECRET_KEY from $ecoPath (check apps[0].env_production.SECRET_KEY)"
          }
          "SECRET_KEY=$secret" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Stop PM2 (Production)
        if: github.ref_name == 'Deploy'
        shell: cmd
        run: |
          cd C:\inetpub\wwwroot\CRTS
          pm2 stop CRTS
          exit /b 0
      - name: build Nuxt app
        env:
          NITRO_OUTPUT_DIR: ${{ env.DEPLOY_DIR }}
          SECRET_KEY: ${{ env.SECRET_KEY }}
        run: bun run build

  pm2_restart:
    needs: call-deploy
    runs-on: ["self-hosted", "WIN-F1K8J4DFM0U"]

    steps:
      - name: Restart PM2 (Production)
        if: github.ref_name == 'Deploy'
        shell: cmd
        run: |
          cd C:\inetpub\wwwroot\CRTS
          pm2 startOrRestart ecosystem.config.cjs --env production
          pm2 save